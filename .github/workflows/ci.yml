name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source and static build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run ci
      - run: bun audit --audit-level=high
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-site
          path: dist/client
          include-hidden-files: true
          retention-days: 1
  browser:
    name: Browser and Lighthouse
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verified-site
          path: dist/client
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run check:lighthouse
  native:
    name: Swift components, CLI, and MCP
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:swift
      - run: sh scripts/build-ios.sh
      - run: bun run test:protocol
  hygiene:
    name: Workflows, shell, and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: actionlint@1.7.12,zizmor@1.32.0,gitleaks@8.30.1,shellcheck@0.11.0,shfmt@3.12.0
      - run: actionlint -color
      - run: zizmor --persona=pedantic --min-severity=high --format=plain .github/workflows
      - run: gitleaks git --redact --no-banner .
      - run: shellcheck --severity=style --enable=all public/install.sh scripts/build-ios.sh .githooks/pre-commit
      - run: shfmt --diff --indent 2 public/install.sh scripts/build-ios.sh .githooks/pre-commit
  gate:
    name: CI
    if: ${{ always() }}
    needs: [source, browser, native, hygiene]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          SOURCE: ${{ needs.source.result }}
          BROWSER: ${{ needs.browser.result }}
          NATIVE: ${{ needs.native.result }}
          HYGIENE: ${{ needs.hygiene.result }}
        run: test "$SOURCE" = success && test "$BROWSER" = success && test "$NATIVE" = success && test "$HYGIENE" = success
  deploy:
    name: Publish Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verified-site
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
